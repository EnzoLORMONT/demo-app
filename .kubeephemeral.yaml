seed:
  image: "node:22"
  env:
    - name: DATABASE_URL
      value: "postgres://postgres:password@postgres:5432/demo"
  command:
    - "/bin/sh"
    - "-c"
    - |
      set -e
      # Créer le répertoire de destination
      mkdir -p /tmp/app
      # Copier les fichiers du ConfigMap (monté dans /src) vers le dossier de travail
      if [ -d "/src" ]; then cp -r /src/. /tmp/app/ || true; fi
      cd /tmp/app
      # Maintenant vous pouvez travailler
      cat << 'EOF' > seed.js
      const { Client } = require('pg');
      const client = new Client({ connectionString: process.env.DATABASE_URL });
      const seedData = [
          { name: 'John Doe', email: 'john@example.com' },
          { name: 'Jane Smith', email: 'jane@example.com' },
          { name: 'Alice Johnson', email: 'alice@example.com' }
      ];
      async function seed() {
          try {
              await client.connect();
              console.log('Connected to database for seeding...');
              await client.query('CREATE TABLE IF NOT EXISTS users (id SERIAL PRIMARY KEY, name VARCHAR(100), email VARCHAR(100) UNIQUE);');
              console.log('Users table ensured.');
              await client.query('TRUNCATE users RESTART IDENTITY;');
              console.log('Users table cleared.');
              for (const user of seedData) {
                  await client.query('INSERT INTO users (name, email) VALUES ($1, $2)', [user.name, user.email]);
                  console.log(`Inserted user: ${user.name}`);
              }
              console.log('Seeding completed successfully.');
              process.exit(0);
          } catch (e) {
              console.error('Seeding failed:', e);
              process.exit(1);
          }
      }
      seed();
      EOF
      npm install pg
      node seed.js
