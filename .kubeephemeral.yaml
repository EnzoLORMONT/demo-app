seed:
  image: "node:22"
  command:
    - "/bin/sh"
    - "-c"
    - "cp /src/* /app/ && cd /app && npm install && npm run seed"
  env:
    - name: DATABASE_URL
      value: "postgres://postgres:password@postgres:5432/demo"
  volumeMounts:
    - name: code
      mountPath: /src
  volumes:
    - name: code
      configMap:
        name: demo-app-code
